<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>Món quà nhỏ dành cho Hoa ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308;color:#fff;font-family:Arial,system-ui,sans-serif}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at center,#101729 0%,#050710 52%,#010207 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.58) 100%);pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:26px;transition:opacity .8s,transform .8s}
.hidden{opacity:0;pointer-events:none;transform:scale(1.035)}
#intro{z-index:2}
#count{font-size:clamp(5rem,22vw,8rem);font-weight:300;line-height:1;color:#f5fbff;text-shadow:0 0 8px #a6edff,0 0 25px #4bb9ff,0 0 65px #328aff;animation:pulse 1s ease-in-out infinite}
#caption{margin-top:20px;font-size:clamp(.78rem,3.3vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:#d9f5ff;text-shadow:0 0 12px #4bb9ff;max-width:90%}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
#giftScreen{z-index:3;background:rgba(1,3,8,.28)}
.gift{font-size:clamp(5rem,24vw,8rem);filter:drop-shadow(0 0 22px #ff7ab9);animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
h1{font-size:clamp(1.3rem,5vw,2rem);color:#ffe6f2;text-shadow:0 0 18px #ff65b1;margin:14px 0 8px}
p{max-width:330px;color:#f5d6e5;line-height:1.6;margin:0 0 22px}
button{border:1px solid #ffc2e0;background:rgba(255,112,179,.17);color:#fff;border-radius:99px;padding:14px 25px;font-size:1rem;box-shadow:0 0 24px #ff5cac33;backdrop-filter:blur(8px)}
#videoScreen{z-index:4;background:#000;padding:0}
video{width:100%;height:100%;object-fit:contain;background:#000}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float{position:absolute;bottom:-10vh;color:#ffb9dc;text-shadow:0 0 14px #ff69b4;animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(24deg);opacity:0}}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));font-size:.72rem;letter-spacing:.13em;color:#d7f3ff99}
</style></head>
<body><main id="app">
<canvas id="matrix"></canvas><div id="shade"></div><div id="floats"></div>
<section class="screen" id="intro"><div id="count">3</div><div id="caption">MỘT MÓN QUÀ NHỎ ĐANG CHỜ EM</div><div id="hint">DÀNH RIÊNG CHO HOA ♡</div></section>
<section class="screen hidden" id="giftScreen"><div class="gift">🎁</div><h1>Một món quà nhỏ dành cho Hoa</h1><p>Mong hôm nay mang đến cho em thật nhiều niềm vui và những điều dịu dàng. 🌷</p><button id="openGift">MỞ MÓN QUÀ ♡</button></section>
<section class="screen hidden" id="videoScreen"><video id="giftVideo" playsinline controls preload="metadata"><source src="./hoa_20_10_7_anh_chu_chay_tung_chu.mp4" type="video/mp4"></video></section>
</main>
<script>
(()=>{const c=document.querySelector('#matrix'),x=c.getContext('2d');let w,h,dpr,drops=[];
const glyphs='01♡♥✧⋆·';
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);drops=Array.from({length:Math.ceil(w/12)},()=>({x:Math.random()*w,y:Math.random()*h,v:1.4+Math.random()*3,len:7+Math.random()*13}));}
addEventListener('resize',resize);resize();
function heart(t){return{x:16*Math.sin(t)**3,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}}
function draw(now){x.clearRect(0,0,w,h);x.font='12px monospace';
drops.forEach(a=>{for(let k=0;k<7;k++){let yy=a.y-k*15;if(yy>-15&&yy<h+15){let alpha=(1-k/7)*.75;x.fillStyle=Math.random()>.88?`rgba(118,224,255,${alpha})`:`rgba(222,244,255,${alpha*.75})`;x.fillText(glyphs[(Math.random()*glyphs.length)|0],a.x,yy)}}a.y+=a.v*2.2;if(a.y-a.len*15>h)a.y=-Math.random()*h;});
let scale=Math.min(w,h)*.014*(1+Math.sin(now/430)*.025);x.save();x.shadowBlur=18;x.shadowColor='#58d9ff';x.strokeStyle='rgba(101,218,255,.85)';x.lineWidth=1.5;x.beginPath();for(let i=0;i<=220;i++){let p=heart(i/220*Math.PI*2),px=w/2+p.x*scale,py=h*.43+p.y*scale;i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.restore();
for(let i=0;i<85;i++){let p=heart(Math.random()*Math.PI*2);let px=w/2+p.x*scale,py=h*.43+p.y*scale;x.fillStyle=`rgba(150,231,255,${.25+Math.random()*.75})`;x.fillRect(px+(Math.random()-.5)*4,py+(Math.random()-.5)*4,1.5,1.5)}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
let n=3;const count=document.querySelector('#count'),intro=document.querySelector('#intro'),gift=document.querySelector('#giftScreen'),vidScreen=document.querySelector('#videoScreen');
let t=setInterval(()=>{n--;if(n>0)count.textContent=n;else{clearInterval(t);intro.classList.add('hidden');setTimeout(()=>gift.classList.remove('hidden'),650)}},1000);
function floaty(){if(!vidScreen.classList.contains('hidden'))return;let e=document.createElement('span');e.className='float';e.textContent=['♡','♥','✧','H','🌸'][Math.random()*5|0];e.style.left=(Math.random()*90+4)+'%';e.style.fontSize=(14+Math.random()*17)+'px';e.style.animationDuration=(6+Math.random()*5)+'s';e.style.setProperty('--dx',(Math.random()*90-45)+'px');document.querySelector('#floats').append(e);setTimeout(()=>e.remove(),12000)}setInterval(floaty,450);
document.querySelector('#openGift').onclick=async()=>{gift.classList.add('hidden');vidScreen.classList.remove('hidden');try{await document.querySelector('#giftVideo').play()}catch(e){}};
})();
</script></body></html>
